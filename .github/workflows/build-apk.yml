name: Build LifeOS Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      #    Required by Gradle 8.10.2 + Android Gradle Plugin 8.7.0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Flutter (stable channel, version matching local SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # 4. Install Dart/Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Run static analysis — fail fast if there are errors
      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      # 6. Build release APK
      #    Signed with debug keys (signingConfig already set to debug in build.gradle.kts)
      - name: Build release APK
        run: flutter build apk --release

      # 7. Upload the APK as a downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
